<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pharmdverse-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="PHARM.D & B.PHARM NEXUS is a cloud-based ERP platform built exclusively for pharmacy colleges to streamline clinical case documentation, academic management, preceptor collaboration, and institutional workflows." />
    <title>PHARM.D & B.PHARM NEXUS - Clinical Case Management Platform</title>

    <!-- Open Graph / WhatsApp / Facebook Link Preview Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pharm-d-b-pharm-nexus.vercel.app/" />
    <meta property="og:title" content="PHARM.D & B.PHARM NEXUS" />
    <meta property="og:description" content="Clinical Case & Practical Record Platform built exclusively for pharmacy colleges." />
    <meta property="og:image" content="https://pharm-d-b-pharm-nexus.vercel.app/pharmdverse-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://pharm-d-b-pharm-nexus.vercel.app/" />
    <meta name="twitter:title" content="PHARM.D & B.PHARM NEXUS" />
    <meta name="twitter:description" content="Clinical Case & Practical Record Platform built exclusively for pharmacy colleges." />
    <meta name="twitter:image" content="https://pharm-d-b-pharm-nexus.vercel.app/pharmdverse-logo.png" />
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      try {
        // Auto-redirect stale preview domain URLs to main production domain
        if (window.location.hostname && window.location.hostname.includes('pharm-d-verse') && !window.location.hostname.includes('pharm-d-b-pharm-nexus')) {
          window.location.href = 'https://pharm-d-b-pharm-nexus.vercel.app' + window.location.pathname + window.location.search;
        }
        if ('serviceWorker' in navigator && typeof navigator.serviceWorker.getRegistrations === 'function') {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            if (registrations && registrations.length) {
              for (var registration of registrations) {
                registration.unregister();
              }
            }
          }).catch(function(){});
        }
        if (window.location.search && window.location.search.includes('v=')) {
          var cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
          window.history.replaceState({path: cleanUrl}, '', cleanUrl);
        }
        var theme = localStorage.getItem('pharmdverse_theme');
        var prefersDark = typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        console.warn('Head script notice:', e);
      }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#080d1a] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
